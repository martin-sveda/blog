############################# About #################################
about:
  enable : true
  title : "O mně"
  
  description : "Celý svůj profesní život se pohybuji v produktovém vývoji. Začal jsem jako programátor
                 embedded zařízení a postupně přešel do manažerských rolí v oblastech letectví, zbrojního průmyslu,
                 zabezpečovací techniky a nakonec jsem zakotvil v IT u vývoje výrobního informačního systému."
  
  content : "Rád dávám věcem řád a nastavuji systém. Baví mě vymýšlet produkty po technologické i obchodní stránce, protože
             úspěch jakéhokoliv řešení se relevantně měří jen počtem a oblíbeností jeho použití koncovými uživateli.
             
             Jsem blázen to technologií, které dokáží posouvat vývojové týmy dopředu a neustále se peru s technologickým
             dluhem. Prostě nesnáším, když ve vývoji vidím dávno přežité technologie, které dělají z produktu těžkopádný
             moloch bez možnosti agilního rozvoje. 
             
             Největší boj se ale odehrává v hlavě každého z nás - spokojenost
             a odkládání každodenního zlepšení je metlou každého produktu."
  image : "images/wrapper-img.jpg"


######################### Portfolio ###############################
portfolio:
  enable : true
  bg_image : "images/featue-bg.jpg"
  title : "VĚŘÍM VE SDÍLENÍ INFORMACÍ"
  content : "
  Nikdo učený z nebe nespadl. Ve svém oboru se profesionálem stane jen ten, kdo se nebojí naslouchat,
  rozpoznat co je dobré a to uplatňovat v praxi. Mám za sebou spoustu přešlapů, ale i nekolik skvělých
  projektů, a díky tomu můžu říct, že už mě máloco dokáže překvapit.
  

  Kdo se bojí, nesmí do lesa.
  "
  button:
    enable : true
    label : "Moje projekty"
    link : "projekty"




