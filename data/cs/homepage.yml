############################# About #################################
about:
  enable : true
  title : "O mně"
  
  description : "Rád dávám věcem řád a nastavuji systém. Baví mě vymýšlet produkty po technologické i obchodní stránce, protože
             úspěch jakéhokoliv řešení se relevantně měří jen počtem a oblíbeností jeho použití koncovými uživateli"
  
  content : "Jsem blázen to technologií, které dokáží posouvat vývojové týmy dopředu a neustále se peru s technologickým
             dluhem. Prostě nesnáším, když ve vývoji vidím dávno přežité technologie, které dělají z produktu těžkopádný
             moloch bez možnosti agilního rozvoje.  A k tomu všemu mám rád lidi, týmy a jejich každodenní rozvoj. 
             Není těžké změnit technologický stack.
             Mnohem těžší je změnit návyky a myšlení lidí, protože největší bariéry jsou v hlavách a často je třeba
             bojovat s předsudky a zažitými zvyklostmi. Není nic lepšího, než když se podaří hlavně tato změna, protože
             pak už to jde samo."
  image : "images/wrapper-img.jpg"


######################### Portfolio ###############################
portfolio:
  enable : true
  image : "images/about/mcoffee.jpg"
  title : "VĚŘÍM VE SDÍLENÍ INFORMACÍ"
  content : "
  Nikdo učený z nebe nespadl. Ve svém oboru se profesionálem stane jen ten, kdo se nebojí naslouchat,
  rozpoznat co je dobré a uplatňovat to v praxi. Své zkušenosti jsem získal díky množství přešlapů,
  ale i díky spoustě skvělých projektů, na kterých jsem měl možnost pracovat. Vždy jsem měl štěstí
  na lidi, které jsem během své kariéry potkal a vděčím jim za všechno, co mi pomohlo otevřít
  oči.


  Moc rád se o své zkušenosti podělím i s vámi, ať už se bude jednat o jakoukoliv formu
  spolupráce. Kdo bude chtít, ten si mě najde.
  "
  button:
    enable : true
    label : "Moje projekty"
    link : "project"




